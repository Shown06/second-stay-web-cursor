## Netlify configuration for Second Stay (Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"

## Static assets: serve real files so /assets/* (manifest, images) are not rewritten to index.html
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

## Admin page
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

## SPA routing: always serve index.html for client-side routes (after assets)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
