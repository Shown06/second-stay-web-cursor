<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECOND STAY | 贅沢なひとときを、あなたへ。</title>
  <meta name="description" content="兵庫・伊丹の高級貸別荘 SECOND STAY。プライベートサウナ・シアタールーム完備。非日常の寛ぎと贅沢なひとときをご提供します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="loading">
    <div class="ld-inner">
      <div class="ld-logo">SECOND STAY</div>
      <div class="ld-line"></div>
      <div class="ld-sub">Premium Private Resort · Itami, Hyogo</div>
    </div>
  </div>
  <style>
    #loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#faf7f2;transition:opacity .8s ease}
    .ld-inner{text-align:center;transform:translateY(8px);animation:ldUp .8s .1s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .ld-logo{font-family:'Zen Maru Gothic',sans-serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:700;color:#3d3429;letter-spacing:.3em;text-transform:uppercase;margin-bottom:14px;opacity:0;animation:ldFade .5s .5s ease forwards}
    .ld-line{width:0;height:1px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,#e07b2a,transparent);animation:ldLine 1.2s .5s ease forwards}
    .ld-sub{font-family:'Zen Maru Gothic',sans-serif;font-size:.7rem;letter-spacing:.2em;color:#7a6e62;opacity:0;animation:ldFade .4s .9s ease forwards}
    @keyframes ldUp{to{opacity:1;transform:translateY(0)}}
    @keyframes ldFade{to{opacity:1}}
    @keyframes ldLine{to{width:120px}}
  </style>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
