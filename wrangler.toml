# Cloudflare Pages 設定（静的サイト dist/ + functions/ の Pages Functions）
# ブログCMS: /admin ログイン → 投稿 → /blog 反映。保存先は KV（SECOND_STAY_CMS）。
name = "second-stay-web"
compatibility_date = "2026-05-22"
pages_build_output_dir = "./dist"

# KV 名前空間（記事・パスワード設定の保存先）。
# 初回のみ作成が必要:  wrangler kv namespace create SECOND_STAY_CMS
# 出力された id を下に貼る。
[[kv_namespaces]]
binding = "SECOND_STAY_CMS"
id = "1091abc492af42e8a512ac7e6cb2ce9a"

# 認証用シークレットは wrangler.toml に書かない（機密のため）。
# 下記をダッシュボード or CLI で Pages プロジェクトに登録する:
#   ADMIN_PASSWORD_HASH  = PBKDF2-SHA256(password, salt, 100000, 32) の hex
#   ADMIN_PASSWORD_SALT  = 16バイトソルトの hex
#   SESSION_SECRET       = HMAC 署名用 32バイトの hex
#   wrangler pages secret put ADMIN_PASSWORD_HASH --project-name=second-stay-web   …等
